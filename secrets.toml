# reach the orchestrator's container only through its environment, and never a sandbox.
FIREWORKS_API_KEY = { item = "fireworks-api-personal", field = "FIREWORKS_API_KEY", description = "the Fireworks key the bins' models run on" }
GH_TOKEN = { item = "github-token-assembly", field = "GH_TOKEN", description = "Matt's fine-grained GitHub token the factory lands cls with: contents read and write, actions read, on the repos it changes" }

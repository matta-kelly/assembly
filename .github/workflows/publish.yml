# Publishes @mku1tra/work, the package in work/, on npm when a version tag `work-v<version>` is pushed: its rule tests
# and its build first, then `npm publish` by trusted publishing (OIDC), with no token and with provenance. crate makes
# the tag on the server from the commit types, after the repo's check passed there, and copies it here; a ruleset lets
# only its deploy key, or an admin of the repo, make a version tag. The tag is the version: package.json's is set from it
# here, never committed. npmjs.com holds the other half: the package's Trusted Publisher names this repo and this file.
name: publish

on:
  push:
    tags: ["work-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 has npm 10.
      - run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npx vitest run work/
      - name: The tag is the package's version
        working-directory: work
        run: npm pkg set version="${GITHUB_REF_NAME#work-v}"
      # A version npm has already is left as it is: a run again, or the first version, published by hand. `npm publish`
      # builds the package first (prepack).
      - name: Publish, if npm does not have this version
        working-directory: work
        run: |
          package=$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')
          if npm view "$package" version >/dev/null 2>&1; then
            echo "npm has $package already"
          else
            npm publish
          fi
